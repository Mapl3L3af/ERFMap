<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101010"><title>erfMap · Survey interface</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<header><strong class="wordmark">erfMap</strong><i></i><span>SURVEY INTERFACE</span><aside>● &nbsp; SYSTEM ONLINE</aside></header>
<main><div id="world"><canvas aria-hidden="true"></canvas><div class="brand"><h1 class="wordmark">erfMap</h1><p>Environmental Revision Flyover Map</p></div><nav aria-label="Survey sections"></nav></div>
<div class="ruler"></div><div class="sheet">FIELD SURVEY &nbsp;/&nbsp; SHEET 001</div><div class="compass">N<div>▲</div>│</div>
<div class="scale"><div></div>0 <span>100 m</span></div><div class="coords" id="coords"></div></main>
<input id="projectFile" type="file" accept=".json,.geojson,application/json" hidden>
<dialog id="joinDialog"><form><h2>Join a survey</h2><label>Four digit code <input name="code" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autofocus></label><div><button type="button" id="cancelJoin">Cancel</button><button>Join project</button></div></form></dialog><p id="homeStatus" role="status"></p>
<footer><div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> <span>Move drone</span></div><div><kbd>↵</kbd> <span>Enter sector</span></div><small>TOP-DOWN VIEW</small></footer><div id="fade"></div><script src="map.js"></script></body></html>
