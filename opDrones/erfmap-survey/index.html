<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>erfMap · Survey workspace</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body>
<header><a href="/" class="brand" title="Environmental Revision Flyover Map">erfMap</a><section class="title"><small>SURVEY WORKSPACE</small><h1 id="name"></h1><p id="subtitle"></p></section><div class="spacer"></div><button id="import">↥ &nbsp; Import survey</button><input hidden id="file" type="file" accept=".geojson,.json"><button id="save">Save scenario ↓</button></header><nav id="documentMenus" aria-label="Survey menus">
<details><summary>File</summary><div class="menu-popover"><button data-command="import">Open survey…</button><button data-command="save">Download scenario</button></div></details>
<details><summary>Edit</summary><div class="menu-popover"><button data-command="undo">Undo geometry edit</button><button data-command="select">Select feature</button><button data-command="move">Move vertex</button></div></details>
<details><summary>Settings</summary><div class="menu-popover menu-settings"><label><input type="checkbox" id="measure" checked> Show dimensions</label><label><input type="checkbox" id="contours" checked> Show contours</label></div></details>
<details><summary>View</summary><div class="menu-popover"><button data-command="fit">Fit survey</button><button data-command="plus">Zoom in</button><button data-command="minus">Zoom out</button></div></details>
<div class="theme-switch" role="group" aria-label="Color mode"><button type="button" id="lightMode" aria-pressed="false">Light mode</button><button type="button" id="darkMode" aria-pressed="true">Dark mode</button></div>
</nav>
<dialog id="propertiesDialog" aria-labelledby="propertiesTitle"><div class="property-dialog-head"><div><small>FEATURE DATA</small><h2 id="propertiesTitle">Properties &amp; tagging</h2></div><button type="button" id="closeProperties" aria-label="Close properties">×</button></div><p class="property-intro">Defaults are prefilled for the selected item type; edit as needed.</p><p id="propertiesMessage" role="status"></p><div id="propertiesFields"></div><div class="property-actions"><button type="button" id="cancelProperties">Cancel</button><button type="button" id="applyProperties" class="active">Save properties</button></div></dialog>
<main>
<section class="workspace"><article><div class="bar" role="toolbar" aria-label="Survey tools"><button id="toolbarUndo" data-command="undo" title="Undo geometry edit" aria-label="Undo geometry edit">↶</button><button id="fit" title="Fit survey">Fit</button><button id="pan" aria-pressed="false">Pan</button><button id="toolbarSelect" aria-pressed="false">Select</button><button id="distanceTool" aria-pressed="false" title="Measure distance between two map points">Distance</button><span class="toolbar-divider"></span><div class="tabs" id="tabs" aria-label="Tool panels"></div><label id="styleControl" hidden>3D · Monochrome</label><div class="seg"><button id="flat" hidden>← Back to plan</button></div></div><div id="surface"><svg id="map" tabindex="0" aria-label="Interactive site map"></svg><canvas id="walk" tabindex="0" hidden aria-label="First-person walkthrough. WASD to walk, Shift to run, Space to jump. Drag to look around."></canvas><svg id="crewOverlay" aria-hidden="true"></svg><section id="sessionPanel" aria-label="Shared survey session"><button id="sessionToggle" type="button">Opening project…</button><div id="sessionDetails" hidden></div></section><div id="pad" hidden><button data-walk="arrowleft" aria-label="Turn left">↶</button><button data-walk="w" aria-label="Walk forward">▲</button><button data-walk="s" aria-label="Walk backward">▼</button><button data-walk="arrowright" aria-label="Turn right">↷</button><button data-walk="shift" title="Hold to run (Shift)">Run</button><button data-walk="jump" title="Jump (Space)">Jump</button></div><label class="badge" id="badge"></label><button id="walker" aria-label="Place walker in 3D" aria-pressed="false" title="Drag the person onto the plan, or click and choose a spot"><svg viewBox="0 0 24 36" aria-hidden="true"><circle cx="12" cy="4.3" r="3.5"/><path d="M8 9h8q3 0 3.7 3l2 9q.4 2-1.4 2.4-1.7.3-2.1-1.5L16 14v18.8q0 2.2-2 2.2t-2-2.2V23h-.7v9.8q0 2.2-2 2.2t-2-2.2V14l-2 7.9q-.5 1.8-2.1 1.5-1.8-.4-1.4-2.4l2-9Q4.5 9 8 9Z"/></svg></button><div class="nav"><button id="minus" title="Zoom out">−</button><button id="plus" title="Zoom in">+</button></div></div><footer id="status" role="status"></footer></article>
<aside><button id="fold" aria-expanded="true" aria-controls="toolBody">Hide tools</button><div id="toolBody"><small>CONTROL PANEL</small><h2 id="panelTitle">Add</h2><section id="panel"></section></div></aside></section><div class="legend" id="legend"></div></main><script src="theme.js"></script><script src="model.js"></script><script src="mobility.js"></script><script src="elevation.js"></script><script src="analysis.js"></script><script src="environment.js"></script><script src="walk.js"></script><script src="changes.js"></script><script src="multiplayer.js"></script><script src="snapping.js"></script><script src="app.js"></script><script src="placement.js"></script><script src="menus.js"></script><script src="properties.js"></script></body></html>
